name: DevOps Pipeline UNSA - Hito 2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  Validacion-y-Calidad:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: medusa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_val_123
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa
      REDIS_URL: redis://localhost:6379
      MEDUSA_ADMIN_ONBOARDING_TYPE: default
      NEXT_DISABLE_ESLINT: 1
      JWT_SECRET: test_jwt_secret
      COOKIE_SECRET: test_cookie_secret

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar Dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint Backend (Type Check)
        run: |
          cd apps/backend
          pnpm exec tsc --noEmit

      - name: Compilar Backend (Medusa v2)
        run: |
          cd apps/backend
          pnpm build

      - name: Ejecutar Migraciones (Backend)
        run: |
          cd apps/backend
          pnpm medusa db:migrate

      - name: Validar Frontend (Storefront - Type Check)
        run: |
          cd apps/storefront
          pnpm exec tsc --noEmit

      - name: Verificar Infraestructura Docker
        run: docker build -t medusa-epis-test .