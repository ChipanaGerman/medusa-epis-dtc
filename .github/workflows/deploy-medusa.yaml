name: Deploy Medusa CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y Subir Imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medusa-backend:latest

      - name: Construir y Subir Imagen Storefront
        uses: docker/build-push-action@v5
        with:
          context: ./apps/storefront
          file: ./apps/storefront/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medusa-storefront:latest

      - name: Desplegar en Servidor (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /ruta/a/tu/proyecto/en/servidor
            docker compose pull
            docker compose up -d --remove-orphans