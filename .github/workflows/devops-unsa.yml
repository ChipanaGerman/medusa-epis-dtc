name: DevOps Pipeline UNSA - Hito 2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  Validacion-y-Calidad:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_val_123
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa
      REDIS_URL: redis://localhost:6379
      MEDUSA_ADMIN_ONBOARDING_TYPE: default
      NEXT_DISABLE_ESLINT: 1

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar Dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar Backend (Medusa v2)
        run: |
          cd apps/backend
          pnpm build

      - name: Validar Frontend (Storefront - Type Check)
        # Cambiamos npx por pnpm exec para usar el TypeScript local
        run: |
          cd apps/storefront
          pnpm exec tsc --noEmit

      - name: Verificar Infraestructura Docker
        run: docker build -t medusa-epis-test .