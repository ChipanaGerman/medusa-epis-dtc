name: CI/CD Pipeline — Medusa EPIS 2026

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── JOB 1: CI — Validación y calidad ───────────────────────────
  ci-validacion:
    name: CI — Build y Validación
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa
          POSTGRES_DB: medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U medusa"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://medusa:medusa@localhost:5432/medusa
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: supersecret_jwt_ci
      COOKIE_SECRET: supersecret_cookie_ci
      NODE_ENV: development
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Instalar dependencias del backend
        run: |
          cd apps/backend
          npm install --legacy-peer-deps

      - name: Build del backend Medusa
        run: |
          cd apps/backend
          npm run build

      - name: Correr migraciones de base de datos
        run: |
          cd apps/backend
          npx medusa db:migrate
        env:
          DATABASE_URL: postgres://medusa:medusa@localhost:5432/medusa

      - name: Ejecutar tests unitarios
        run: |
          cd apps/backend
          npm run test:unit --passWithNoTests
        env:
          DATABASE_URL: postgres://medusa:medusa@localhost:5432/medusa

      - name: Verificar build Docker
        run: |
          docker build -t medusa-epis-test:${{ github.sha }} \
            -f apps/backend/Dockerfile \
            apps/backend/

  # ─── JOB 2: CD — Deploy a Railway (solo en main) ────────────────
  cd-deploy-railway:
    name: CD — Deploy a Railway
    runs-on: ubuntu-latest
    needs: ci-validacion
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy a Railway
        run: railway up --service medusa-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─── JOB 3: Deploy docs a GitHub Pages ──────────────────────────
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: ci-validacion
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4