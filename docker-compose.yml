services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres_epis
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_epis:/var/lib/postgresql/data
    networks:
      - medusa_network_epis

  redis:
    image: redis:7-alpine
    container_name: medusa_redis_epis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medusa_network_epis

  medusa:
    build: .
    container_name: medusa_backend_epis
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "9000:9000"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/medusa-store
      - REDIS_URL=redis://redis:6379
    env_file:
      - apps/backend/.env.template
    volumes:
      - .:/server
      - /server/node_modules
      - /server/apps/backend/node_modules
    networks:
      - medusa_network_epis

  storefront:
    build: .
    container_name: medusa_storefront_epis
    restart: unless-stopped
    depends_on:
      - medusa
    ports:
      - "8000:8000"
    environment:
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://medusa:9000
    env_file:
      - apps/storefront/.env.template
    volumes:
      - .:/server
      - /server/node_modules
      - /server/apps/backend/node_modules
      - /server/apps/storefront/node_modules
      - /server/apps/storefront/.next
    entrypoint: ["./start-storefront.sh"]
    networks:
      - medusa_network_epis

volumes:
  postgres_data_epis:

networks:
  medusa_network_epis:
    driver: bridge